# Local development services. Nothing here is production configuration.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentbank
      POSTGRES_PASSWORD: agentbank
      POSTGRES_DB: agentbank
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentbank -d agentbank"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
